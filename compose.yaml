services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash_erp
      POSTGRES_PASSWORD: flash_erp
      POSTGRES_DB: flash_erp
    ports:
      - '5433:5432'
    volumes:
      - flash_erp_postgres:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flash_erp -d flash_erp']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: flash_erp
      DB_PASSWORD: flash_erp
      DB_DATABASE: flash_erp
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  flash_erp_postgres:
