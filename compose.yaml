services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flash_erp
      POSTGRES_PASSWORD: flash_erp
      POSTGRES_DB: flash_erp
    ports:
      - '5433:5432'
    volumes:
      - flash_erp_postgres:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flash_erp -d flash_erp']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: development
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: flash_erp
      DB_PASSWORD: flash_erp
      DB_DATABASE: flash_erp
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '3333:3333'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - '5173:8080'
    depends_on:
      - backend

volumes:
  flash_erp_postgres:
